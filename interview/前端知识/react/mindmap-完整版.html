# 📚 React 核心与调度机制 · 完整版

## 一、主线：setState → Render → Commit

### setState
- React 调度更新

### Render 阶段
- 执行组件
- 得到新的 React Element
- Reconciliation / Diff
- 生成需要提交的变化

### Commit 阶段
- 修改真实 DOM
- → useEffect 等

### Fiber 参与的定位
- Render 工作如何被**组织、拆分、调度**

### 一句话区分 Virtual DOM 与 Fiber
- Virtual DOM 解决"描述 UI 是什么"
- Fiber 解决"React 如何组织和调度更新工作"

## 二、Fiber 要解决的核心问题：可中断渲染

### 传统递归更新的痛点
- 传统递归更新
  - 同步执行
- 任务太重
- 长时间占用 JS 主线程
- 用户输入、动画等无法及时响应

### Fiber 的核心价值
- 把原本**不可中断的递归工作**
- 变成可以被**拆分、暂停和恢复**的工作单元

#### 调度流程
- Fiber 节点
- 执行一部分 render work
- 发现需要让出主线程
- 暂停
- 浏览器处理更紧急的事情
- 之后继续 render

### 完整调度链路（含 Work-in-Progress）

- setState
  - 产生更新
- React 调度
- Render / Reconciliation
- Fiber Diff
- 构建 **Work-in-Progress Tree**
- 确定需要进行哪些 DOM 更新
- Commit
  - 将变化应用到真实 DOM

### Fiber 的意义
- 让 Render 阶段的工作能够被**拆分、暂停、恢复甚至丢弃重做**
- 从而支持 React 的并发调度

### 应用层的调度能力：startTransition
- **Fiber** 是底层的架构能力
- **startTransition** 是开发者可以使用的调度能力之一

## 三、目前掌握的完整知识链

### 从 Snapshot 到 Fiber 的完整链条
- State Snapshot
  - setState 不修改当前 Render 的 state
- Closure
  - 异步回调可能产生 Stale Closure
- Updater Function
  - 函数式更新避免依赖旧值
- Update Queue
- Batching
- Render
- Commit
- Fiber / 调度 / 可中断渲染

## 四、Render / Commit 的完整生命周期（含 Hooks 时机）

### 时序链路
- Render
- ↓
- Commit：DOM 更新
- ↓
- useLayoutEffect
- ↓
- 浏览器 Paint
- ↓
- useEffect

### 关键结论
- **useLayoutEffect** 发生在 **DOM 更新之后、浏览器绘制之前**
  - 因此在 Paint 前可以读取并修改 DOM
- **useEffect** 发生在 **浏览器绘制之后**
  - 适合非阻塞的副作用

### useLayoutEffect 特别适合
- 读取 DOM → 计算位置/尺寸 → 立即修改 DOM → 浏览器再 Paint
- 用户就不容易看到中间状态

### 为什么不全部使用 useLayoutEffect？
- 因为 useLayoutEffect **会阻塞浏览器绘制**
- 如果里面执行耗时操作，会延迟 Paint
- 影响页面响应和性能
- 因此普通副作用优先使用 useEffect
- 只有涉及 **DOM 测量、同步 DOM 调整并需要避免视觉闪烁**时才用

## 五、key 的作用：identity 优先于速度

### 常见误区
- 问：「key 是不是为了让 Diff 更快？」
- 🟡 不能简单这么说
- key 确实有助于 React 在列表 reconciliation 时判断哪些元素是相同身份
- 但核心**不是**"为了提高 Diff 算法速度"
- **而是**为了正确识别列表元素的身份，从而正确进行 reconciliation 和复用
- 性能是结果之一，identity（身份）才是核心

### 标准回答
- key 的核心作用是帮助 React 在多次 Render 之间识别列表元素的**稳定身份**
- 从而在 reconciliation 时正确判断哪些元素可以复用、哪些新增、删除或者移动

### 为什么不能用 index 当 key
- 当列表发生**插入、删除或排序**时
- index 会变化
- 可能导致 React 复用错误的组件实例
- 从而出现 **state 错位**等问题

## 六、Context 性能问题排查与优化

### 面试场景
- "Context 导致很多组件 Render，你怎么定位和优化？"

### 优化步骤
- 第一步：React DevTools **Profiler** 确认哪些组件发生了不必要的 Render
- 第二步：检查 Context Provider 的 value 是否每次父组件 Render 产生新引用
  - 是 → 使用 `useMemo` 稳定 value
- 第三步：根据状态更新频率和业务职责**拆分 Context**
  - 避免一个 Context 承载大量互不相关状态
- 第四步：缩小 Context Consumer 范围
- 第五步：使用 Zustand 等支持 selector 的状态管理方案

## 七、Hooks 规则的本质

### 规则
- Hooks 不允许放在**条件、循环和嵌套函数**中

### 本质原因
- 保证每次 render 的 **Hook 调用顺序稳定**
- 从而让 React 能正确关联每个 Hook 对应的状态

## 八、useState vs useRef

### useState
- 数据变化 → React 调度 render
- 产生新的 state snapshot

### useRef
- 数据变化 → 不触发 render
- 所有 render / 闭包共享同一个 ref 对象
- 通过 ref.current 获取最新值

### 结论
- **state 适合驱动 UI**
- **ref 适合保存不驱动 UI 的可变数据**

## 九、useEffect 为什么不能是 async

### 原因
- useEffect 的 callback **不能直接声明为 async**
- async callback 会返回 Promise
- 而 Effect 的返回值**专门用于 cleanup**

### Effect 的完整思维模型
- render
- Effect setup
- 与外部系统同步
- 外部系统变化 / dependency 变化
- cleanup
- 重新 setup

## 十、受控组件

### 什么时候需要受控
- 实时校验
- 实时格式化
- 根据输入动态显示 UI
- 控制按钮 disabled
- 条件渲染
- 多个组件共享表单值
- 提交前统一处理

### "50 个字段全部受控，一定有性能问题吗？"
- **不一定**
- 关键看 state 更新导致的组件 render 范围和每次 render 的成本
- 如果表单组件很大、字段更新频繁：
  - 组件拆分
  - React.memo
  - 局部状态或字段级订阅
  - 降低不必要的渲染

## 十一、state 更新与引用比较（不可变更新）

### React 对 state 更新进行引用/值比较
- 如果设置的是相同的对象引用
- React 通常可以直接跳过这次更新

### 为什么 React 推荐不可变更新（两个核心）

#### ① 方便 React 判断数据有没有变化
- React 通过引用判断：`oldUser !== newUser`
- "这个 state 对象是不是换了？"

#### ② 对性能优化非常重要
- `React.memo`、`useMemo`、Context
- 都大量依赖引用是否稳定
- 例如 `oldUser === newUser` 帮助 React 判断："这个对象没变化，可以复用"

## 十二、StrictMode：开发期检查机制

### 定位
- StrictMode 在**开发环境**下会主动进行额外的 Render 或 Effect 生命周期检查
- 用来发现副作用、cleanup 不完整以及其他潜在问题
- 🔥 主要是**开发期的检查机制**，不代表生产环境会进行同样的重复执行

### 具体行为（仅开发环境）
- 组件会 **re-render 额外一次** → 发现不纯渲染 bug
- 组件会 **re-run Effect 额外一次** → 发现 missing Effect cleanup
- 组件会 **re-run ref callback 额外一次** → 发现 missing ref cleanup
- 检查**已废弃 API** 的用法
