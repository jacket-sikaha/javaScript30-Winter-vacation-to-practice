# 📝 面经知识点速记版

## 📦 构建与工程化

### 🔥 Vite vs Webpack
- ⭐ 一句话：Webpack「先打包再运行」，Vite「不打包直接运行，按需编译」
- 启动：Webpack 慢（全量打包）；Vite 极快（毫秒级，只处理入口）
- 热更新：Webpack 重新打包相关模块；Vite 只编译修改的文件
- 底层工具：Webpack 自身处理；Vite 开发用 esbuild（Go，几十倍快），生产用 Rollup

### 🔥 Vite 冷启动为什么快
- ⭐ ESM 支持：浏览器原生加载 ESM，不打包
- esbuild 预构建依赖（Go 语言写的）
- 按需编译：只编译所请求的文件
- 智能缓存：预构建结果存 `.vite/deps`，依赖不变直接复用

### Vite 打包优化（生产阶段用 Rollup）
- 开发阶段几乎不需要优化（ESM + 按需编译 + 预构建）
- 生产阶段优化三关键词：**缓存、拆分、压缩**
  - `optimizeDeps.exclude` 跳过不需要预构建的包
  - 禁用 source map（生产按需开启）
  - 动态导入实现代码分割（路由懒加载）
  - terser → 可替换为更快的 esbuild 压缩
  - CI/CD 缓存 `node_modules` 和 `.vite` 目录
  - 优化 resolve.alias 减少路径查找（monorepo 分包慎用）

### Tree Shaking
- ⭐ 关键：ES6 模块是**静态**的（import/export 编译时确定）
- 从入口文件遍历，标记死代码并删除
- 组件库按需加载：打包插件把默认 import 转成分别 import JS/CSS

### 🔥 Webpack Loader vs Plugin
- ⭐ **Loader 管「文件转换」**（微观）：处理单个非 JS/JSON 文件
  - css-loader 解析 @import/url()
  - style-loader 注入 `<style>` 标签
  - babel-loader ES6+ → ES5
  - file-loader 处理图片/字体
- ⭐ **Plugin 管「流程扩展」**（宏观）：控制打包全流程
  - 压缩代码、生成 HTML 等
- Plugin 原理：`apply` 方法 + compiler hooks（发布订阅/Tapable）

### ESM 转 CJS
- 本质：替换 `import/export` 为 `require/module.exports`
- 工具：Babel / Rollup

## 🔧 包管理与依赖

### 🔥 pnpm 为什么快 / 解决了什么问题
- ⭐ 本质：**全局仓库 + 硬链接 + 严格依赖树**
- 相同包只存一份（内容寻址存储），不像 npm 每次下载一份
- 通过硬链接/软链接到 node_modules，更快

### 幽灵依赖问题
- npm/yarn 的 hoisting 扁平化 → 未声明的依赖也能用
- 隐患：a 库升级删掉隐藏的 b 库 → 代码依赖 b 库 → 运行失败
- ⭐ pnpm 根治：**物理隔离 + 严格沙箱**，文件系统结构物理阻断访问

### pnpm node_modules 三层结构
- ① 项目根目录：只含直接依赖的软链接
- ② `.pnpm` 目录（虚拟存储）：局部扁平化，依赖隔离
- ③ 全局存储 `~/.pnpm-store`：内容寻址，相同内容只存一份，硬链接

## 🌐 网络协议

### HTTP 协议基础
- 无状态协议：每次请求独立（Cookie/Session 模拟状态）
- 应用层：基于 TCP（HTTP/1/2）或 UDP（HTTP/3）
- 明文（HTTP）vs 加密（HTTPS = HTTP + TLS）

### 🔥 HTTP/1 vs HTTP/2 vs HTTP/3
- **HTTP/1.1**：TCP，持久连接 Keep-Alive，痛点 = 应用层队头阻塞（串行）
- **HTTP/2**：TCP+TLS，多路复用（单连接并发），HPACK 头部压缩，痛点 = TCP 丢包全连接阻塞
- **HTTP/3**：QUIC（UDP+TLS1.3），流级独立（丢包只影响单流），0-RTT 快连
- ⭐ 口诀：1.1 堵在请求，2.0 堵在 TCP，3.0 堵不住

### Content-Type
- 决定内容类型，告诉对方如何解析

### Keep-Alive
- 复用 TCP 连接，避免每次重建（减少握手开销）
- HTTP/1.1 默认生效

### 🔥 预检请求（Preflight）
- 触发条件：PUT/DELETE、`Content-Type: application/json`、自定义头
- 目的：保护服务器免受未知跨域风险，防 CSRF
- 浏览器对「非简单请求」格外谨慎

### HTTP 请求方法
- CREATE → POST / READ → GET / UPDATE → PUT（全量）/ PATCH（部分）/ DELETE → DELETE
- GET 参数在 URL，POST 在 body；POST 传输数据更多

### HTTP 状态码
- 1xx 信息 / 2xx 成功 / 3xx 重定向 / 4xx 客户端错误 / 5xx 服务器错误
- 常见：200/201/204/301（永久）/302（临时）/304/400/401/403/404/500/502/503/504

### 七层模型
- 物数网传会表应（从下到上）
- 物理层 → 数据链路层 → 网络层（IP）→ 传输层（TCP/UDP）→ 会话层 → 表示层 → 应用层

### TCP vs UDP
- TCP：面向连接、可靠、慢（三次握手、丢包重传、按序）
- UDP：无连接、不可靠、快（无额外开销）
- TCP 场景：网页/文件下载/登录；UDP 场景：视频通话/直播/游戏

### 跨域解决方案
- 同源策略：同协议+同 host+同端口
- JSONP：`<script>` 不受限，只支持 GET，兼容好但不安全
- CORS：服务端设响应头 Access-Control-Allow-Origin 等
- Proxy：本地代理（服务端间通信不受跨域限制）
- Nginx：线上反向代理 rewrite

## 🖥️ 浏览器与渲染

### 🔥 URL 输入到页面显示
- URL 解析 → DNS 解析 → TCP 连接 → HTTP 请求响应 → 页面渲染
- DNS 解析顺序：浏览器缓存 → OS 缓存(hosts) → 本地 DNS → 根 → 顶级 → 权威
- 渲染：HTML→DOM树，CSS→CSSOM树，DOM+CSSOM→Render树，Layout回流，Paint重绘，Composite合成
- ⚠️ JS 会阻塞 DOM 解析（等 JS 执行完）；CSS 加载阻塞渲染但不阻塞 DOM 构建

### 浏览器内核（渲染引擎）
- 网络线程下载资源 → 主线程解析 HTML→DOM、CSS→CSSOM → 合并 Render 树 → 布局
- 合成线程拆图层 → 光栅线程转像素 → GPU 显示

### 浏览器缓存
- ⭐ 强缓存 vs 协商缓存
  - 强缓存：直接用缓存不发请求，`Cache-Control`/`Expires`，返回 200 from cache
  - 协商缓存：向服务器验证，`Last-Modified`/`ETag`，返回 304 或 200
  - ETag 优先级高于 Last-Modified
- 存储位置：Memory Cache（快/关浏览器清） / Disk Cache（大/持久） / Service Worker

### 🔥 BFC（块级格式化上下文）
- BFC 是独立布局环境，解决浮动和 margin 问题
- 触发方式：float、absolute/fixed、根元素、display:flex/grid、overflow:hidden
- ⭐ `overflow: hidden` 是首选方案
- 应用：清除浮动（父元素塌陷）、避免 margin 重叠

### FOUC（无样式内容闪烁）
- 原因：CSS 未在渲染前加载
- 避免：CSS 放 `<head>` + 内联关键 CSS + 禁用 @import + `rel="preload"`

### SEO 前端优化
- ⭐ 语义化 HTML 是地基，元信息是门牌，速度是门槛，图片 Alt 是说明，SPA 要 SSR

### 性能优化五要点
- ① 减少 HTTP 请求（合并文件、雪碧图、CDN）
- ② 压缩资源（Gzip/Brotli、WebP、UglifyJS）
- ③ 合理缓存（Cache-Control、版本号、Service Worker）
- ④ 优化关键渲染路径（CSS 放 head、JS 放底部/async/defer、内联关键 CSS）
- ⑤ 懒加载非关键资源（`loading="lazy"`、IntersectionObserver、`preload="none"`）

## ⚡ JavaScript 核心

### 🔥 闭包
- ⭐ 内层函数能访问外层函数变量，且外层函数执行完变量不销毁
- 形成条件：函数嵌套 + 引用外层变量 + 外层函数返回内层函数
- 用途：保存变量（防抖/节流）、私有化变量
- ⚠️ 滥用会内存泄漏

### React 中的闭包问题
- 函数组件闭包捕获**当前渲染时的状态值**
- 异步操作（setTimeout/事件监听/请求）拿到「旧状态」→ Stale Closure
- ⭐ 解法：函数式更新 / useRef 存最新值 / 清理副作用

### 作用域链
- 三层：自身作用域 → 外层函数作用域 → 全局作用域
- 变量查找规则：从内向外依次查找
- 作用域链是闭包能「记住」变量的根本原因

### 🔥 原型与原型链
- **原型 prototype**：函数的属性，定义共享属性/方法
- **原型链 `__proto__`**：对象的属性，属性查找路径
- `对象.__proto__` → 构造函数 `.prototype`
- 查找规则：自身 → `__proto__` → 直到 `Object.prototype`（终点）
- `Object.prototype.__proto__ === null`
- 优势：内存优化 + 动态继承

### instanceof
- 沿原型链向上查找，看能否找到构造函数的 prototype
- vs typeof：typeof 判基本类型，instanceof 判引用类型

### 继承方案
- 原型链继承（⭐）：子原型=父实例，引用属性共享
- 借用构造（⭐⭐）：属性绑定到实例，无法继承方法
- 组合继承（⭐⭐⭐）：结合前两者，但父构造调用 2 次
- ⭐ 寄生组合（⭐⭐⭐⭐⭐最佳）：用 Object.create() 避免调用 Parent()，只调 1 次
- ES6 Class（⭐⭐⭐⭐）：语法糖

### new 操作符
- ① 创建新对象 obj
- ② `obj.__proto__ = 构造函数.prototype`
- ③ call 调用构造函数，this 指向 obj
- ④ 返回 obj

### this 指向
- 函数独立调用 → window（浏览器）
- 对象方法调用 → 该对象
- 事件处理 → 触发事件的 DOM
- 构造函数 → new 的实例
- 箭头函数 → 继承外层 this（不能 new，无 arguments）

### bind / call / apply
- call：接收若干参数，直接执行
- apply：接收参数数组，直接执行
- bind：返回改变 this 的新函数，不立即执行

### 事件机制
- 事件三要素：DOM 元素 + 事件名称 + 处理函数
- 事件流：捕获（window→目标）→ 目标 → 冒泡（目标→window）
- 传统 `onclick` 只能绑一个；`addEventListener` 可绑多个、可控冒泡
- 事件对象：`event.target`（触发元素）/ `currentTarget`（绑定元素）/ `stopPropagation()` / `preventDefault()`
- ⭐ 事件委托：利用冒泡，父元素一个监听处理所有子元素事件

### 事件循环
- 浏览器：宏任务 → 微任务 → 渲染，微任务优先于宏任务，支持 requestAnimationFrame
- Node.js：6 阶段循环，每阶段后清空微任务，`process.nextTick` 优先级最高
- Node 6 阶段：timer → pending回调 → idle/prepare → poll → check → close
- `setImmediate` 和 `setTimeout` 顺序不定

### Cookie / localStorage / sessionStorage / IndexedDB
- Cookie：4KB，随 HTTP 请求发送，可配过期，服务器识别用户
- localStorage：5MB，永久，仅客户端
- sessionStorage：5MB，会话级（关标签页清空）
- IndexedDB：50MB+，永久，支持查询，离线缓存

## 🛠️ 前端框架与路由

### 🔥 React vs Vue
- React：库，JSX，手动触发更新（setState），需手动优化（memo），生态自由
- Vue：框架，模板语法，数据劫持（Proxy）自动更新，编译时+运行时自动优化，渐进式

### 🔥 为什么 Hook 不能用在 if 里
- ⭐ Hooks 底层依赖**固定顺序的链表/数组**存储状态
- 每个 Hook 对应唯一索引位置
- 条件/循环改变执行顺序 → 索引错位 → 读取错误状态
- 必须写在函数组件顶层

### 🔥 渲染列表为什么要加 key
- ⭐ key 是虚拟 DOM 节点的唯一标识
- key 相同 → React 复用 DOM，仅更新 props
- key 不同 → 销毁旧 DOM，创建新 DOM
- ❌ 用 index 当 key：删除第一项后索引 0 复用了错误的 input → 内容错位
- 本质：避免错误复用 DOM + 提升渲染性能

### 哈希路由 vs History 路由
- ⭐ 哈希路由：URL 含 `#`，`#` 后不发服务器，不需服务器配置，兼容好（IE11），SEO 差
- History 路由：URL 无 `#`，需服务器配置重定向到 index.html，SEO 好，企业级推荐
- 跳转机制：`window.location.hash` vs `history.pushState()`
- 前提：服务器无论哪个路径都返回 index.html

### 受控组件 vs 非受控组件
- 受控：state 管理值 + onChange 更新，场景：实时验证/密码明文控制
- 非受控：浏览器控制，ref 获取数据，不触发 React 状态更新，场景：简单输入

## 🔒 安全与认证

### Cookie 安全属性
- ⭐ SameSite：防 CSRF（Strict/Lax/None）
- Secure：仅 HTTPS 发送（与 SameSite=None 组合）
- ⭐ HttpOnly：禁止 JS 访问，防 XSS 窃取
- Max-Age：相对过期时间（替代 Expires）
- Domain：限制作用域

### Token vs Cookie 存储认证
- SPA/移动端：认证信息存客户端，减轻服务端压力
- 同源/跨子域：Cookie 可传输（example.com → api.example.com）
- 跨主域名：必须用 Token

## 🖼️ SSR 与水合

### SSR（服务端渲染）
- 服务器直接生成完整 HTML 发给浏览器
- 优点：首屏快（不需等 JS）、搜索引擎友好（爬虫不执行 JS）

### 🔥 水合失败原因
- 服务器与客户端内容不一致（Math.random / new Date()）
- 依赖浏览器 API（SSR 中使用 window）
- 数据不一致（服务端预取 vs 客户端实时数据）
- ⭐ 解决：环境判断（window 不为空才执行）+ state 管理动态内容（SSR 赋初始值，useEffect 更新）

## 🔧 Babel 原理

### 工作流程（三阶段）
- ⭐ **解析** → **转换** → **生成**，以 AST 为核心桥梁
- ① 解析源码为 AST（@babel/parser）
- ② 加载插件，遍历 AST 调用 visitor 方法（@babel/traverse）
- ③ 修改 AST（@babel/types）
- ④ 生成目标代码（@babel/generator）
- 核心引擎：@babel/core

### 应用场景
- 语法转换（箭头函数→普通函数、class→构造函数）
- Polyfill 填充（Promise、Array.from）
- JSX 转换（JSX → React.createElement）
- 代码重构 codemods

## 📊 进程与线程

### 进程 vs 线程
- 进程：独立地址空间、独立资源、创建开销大、IPC 通信、隔离安全
- 线程：共享进程空间、共享资源、创建开销小、共享内存通信、需同步机制

### 何时选择
- 多进程：高稳定性（浏览器标签页）、CPU 密集型（利用多核）
- 多线程：I/O 密集型（Web 服务器）、需简单通信

### 关键概念
- 并发：同一时间段交替执行 / 并行：同一时间点同时执行（需多核）
- GIL：Python 全局解释器锁 / IPC：进程间通信

## 🎯 零散高频考点

### 图片懒加载
- 本质：快进入可视区域才加载，data-src 存真实 URL
- 优化：滚动事件加防抖 / 用 IntersectionObserver

### 虚拟列表
- 本质：只渲染可视区域，占位容器撑总高度，滚动时替换内容

### Ajax
- XMLHttpRequest 控制，异步不刷新获取数据
- 现代替代：Fetch API（支持 Promise，不需手动处理状态）

### 变量提升
- var 声明和函数声明移动到作用域顶部
- 用 let/const 替代 var 避免提升问题

### 判断对象类型
- 基本类型 → typeof
- 引用类型 → Array.isArray / Object.prototype.toString

### HTML5 新特性
- 语义化标签 / 多媒体原生支持 / localStorage+sessionStorage / 表单增强 / 地理位置 / WebSocket

### link vs @import
- link：立即加载、兼容好、放 HTML、提升首屏
- @import：延迟加载、IE8- 不支持、放 CSS、可能卡页面

### 页面加载完成判断
- ⭐ DOMContentLoaded：DOM 结构完成，不等图片样式，最推荐
- document.readyState：loading→interactive→complete，通用方案
- window.onload：所有资源完成，比 DCL 晚，不推荐
- Vue mounted / React useEffect

### 判断对象类型方法
- 基本数据类型 → typeof
- 引用类型 → Array.isArray() / Object.prototype.toString.call()
